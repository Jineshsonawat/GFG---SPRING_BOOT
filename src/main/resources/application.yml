server:
  port: 9090

spring:
  application:
    name: JDBL 86

  datasource:
    url: "jdbc:postgresql://localhost:8080/postgres"
    username: postgres
    password: 1101
    driver-class-name: org.postgresql.Driver
    Hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true

